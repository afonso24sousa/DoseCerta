# Check complementar da frontend-mobile-ci (Issue I061; mesmo modelo da backend-ci-sem-alteracoes, Issue I031).
# Corre apenas em Pull Requests para a main que não alteram frontend-mobile/** nem a frontend-mobile-ci, para que o
# check obrigatório qualidade-frontend-mobile não fique pendente (Regulamento Interno do Grupo, secção 10.1).
# Não compila nem testa: nesses Pull Requests os quality gates QG-07, QG-10 e QG-11 não se aplicam.
name: frontend-mobile-ci-sem-alteracoes

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'frontend-mobile/**'
      - '.github/workflows/frontend-mobile-ci.yml'

permissions:
  contents: read

jobs:
  qualidade-frontend-mobile:
    name: qualidade-frontend-mobile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sem alterações no frontend mobile
        run: echo "Este Pull Request não altera frontend-mobile/** nem a frontend-mobile-ci; os quality gates QG-07, QG-10 e QG-11 não se aplicam."
