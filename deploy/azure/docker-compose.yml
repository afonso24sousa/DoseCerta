# Ambiente de demonstração no Azure (VM única): SQL Server 2022, API e Caddy (Issue I040).
# Segredos no ficheiro deploy/azure/.env da VM (não versionado), escrito pelo workflow backend-cd
# a partir dos GitHub Secrets. Ver deploy/azure/.env.example.
name: dosecerta-demo

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "${MSSQL_PID:-Developer}"   # Regulamento Interno do Grupo, secção 11.2
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Falta MSSQL_SA_PASSWORD}"
    ports:
      - "127.0.0.1:1433:1433"          # só acessível dentro da VM (SSMS por túnel SSH)
    volumes:
      - sql-dados:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: ../../backend
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"   # o Caddy termina o HTTPS e envia X-Forwarded-Proto
      ConnectionStrings__DoseCerta: "Server=sqlserver,1433;Database=DoseCerta;User Id=dosecerta_app;Password=${DOSECERTA_APP_PASSWORD:?Falta DOSECERTA_APP_PASSWORD};Encrypt=true;TrustServerCertificate=true"
      BaseDados__AplicarMigracoesNoArranque: "true"
      Jwt__Chave: "${JWT_CHAVE:?Falta JWT_CHAVE}"
      Email__Servidor: "${EMAIL_SERVIDOR:-}"
      Email__Porta: "${EMAIL_PORTA:-587}"
      Email__Utilizador: "${EMAIL_UTILIZADOR:-}"
      Email__PalavraPasse: "${EMAIL_PALAVRA_PASSE:-}"
      Email__Remetente: "${EMAIL_REMETENTE:-}"
      Documentos__PastaRaiz: "/dados/documentos"
    volumes:
      - /srv/dosecerta/documentos:/dados/documentos
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: "${DOMINIO:?Falta DOMINIO}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-dados:/data
    depends_on:
      - api
    restart: unless-stopped

volumes:
  sql-dados:
  caddy-dados:
